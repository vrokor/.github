<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -110 871.30 110" role="img" aria-label="VROKOR">
  <title>VROKOR primary lockup</title>
  <!--
    PRIMARY LOCKUP — emblem left, wordmark right, aligned on the centre axis.
    Wordmark is OUTLINED Chakra Petch Bold (SIL OFL 1.1). No font dependency:
    this file renders identically everywhere, including in email and press kits.

    Proportions, with H = emblem art height = 100:
      · emblem     1:1    -> 100 x 100
      · gap        0.75H  -> 75
      · wordmark   cap 110, width 652.3  (aspect 5.93:1)
      · total             -> 871 x 110

    ⚠️ DEVIATION from spec Batch 1 § 1.2, which states a 5.2:1 wordmark.
    Chakra Petch Bold set at cap-height 110 measures 5.93:1 even at zero
    tracking (5.79:1). The mockup's letterforms are not Chakra Petch,
    so the 5.2:1 was measured off a different face. Condensing the type to hit
    5.2 would distort it. Raised with the CEO — see docs/VROKOR-AUDIT.md § 6.

    CLEAR SPACE IS NOT BAKED IN: the 1.0xH minimum on all four sides is a usage
    rule, applied in layout. Padding it in would make every downstream size wrong.

    Faceted ("ink" palette — dark mark for a light canvas): base/lit/shadow/arm
    planes per public/brand/vk-emblem.svg's construction. The in-app component
    (geometry.ts + VrokorMark.tsx) also carries the "metal" palette for dark
    theme; this static file is ink-only since it has no CSS to theme it.
  -->
  <defs>
    <linearGradient id="vkFacetBase" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b323c"/>
      <stop offset="0.55" stop-color="#1c212a"/>
      <stop offset="1" stop-color="#0d0e10"/>
    </linearGradient>
    <linearGradient id="vkFacetLit" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#4a5568"/>
      <stop offset="1" stop-color="#2f3640"/>
    </linearGradient>
    <linearGradient id="vkFacetShadow" x1="0.2" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14171c"/>
      <stop offset="1" stop-color="#050506"/>
    </linearGradient>
    <linearGradient id="vkFacetArm" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#1f242c"/>
      <stop offset="1" stop-color="#383f4a"/>
    </linearGradient>
  </defs>
  <g transform="translate(-6.818 -114.091) scale(1.13636)">
    <path d="M6 8 L28 8 L36 50 L44 8 L66 8 L36 96 Z" fill="url(#vkFacetBase)"/>
    <path d="M6 8 L17 8 L36 96 Z" fill="url(#vkFacetLit)"/>
    <path d="M44 8 L55 8 L36 96 L36 50 Z" fill="url(#vkFacetShadow)"/>
    <path d="M49 50 L70 8 L94 8 L68 50 L94 96 L70 96 Z" fill="url(#vkFacetArm)"/>
    <path d="M49 50 L70 8 L81 8 L60 50 Z" fill="url(#vkFacetLit)"/>
    <path d="M49 50 L60 50 L81 96 L70 96 Z" fill="url(#vkFacetShadow)"/>
    <path d="M49 50 L60 50" fill="none" stroke="#454e5c" stroke-width="0.9" opacity="0.55"/>
  </g>

