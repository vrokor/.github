  </g>

  <!-- Terminal dot. Spec Batch 1 § 1: an absolute boundary, an air-gapped
       environment, a closed statement. Sits on the baseline. -->
  <circle cx="856.30" cy="-15.00" r="15" fill="#FF9F00"/>
</svg>
